<!doctype html>
<html xmlns:th="http://www.thymeleaf.org" lang="ro">
<head>
    <meta charset="UTF-8">
    <title>Coș de cumpărături - AutoKat</title>
    <script src="https://cdn.tailwindcss.com"></script>
</head>

<body class="bg-slate-100 min-h-screen flex flex-col">

<header class="bg-white shadow-sm">
    <div class="max-w-6xl mx-auto px-4 py-3 flex items-center justify-between">
        <a th:href="@{/catalog}" class="flex items-center gap-2">
            <span class="inline-flex h-8 w-8 items-center justify-center rounded-full bg-blue-600 text-white font-bold">A</span>
            <span class="text-xl font-semibold text-slate-800">AutoKat</span>
        </a>

        <nav class="flex items-center gap-4 text-sm">
            <a th:href="@{/catalog}" class="text-slate-700 hover:text-blue-600">Catalog</a>
            <a th:href="@{/cart}" class="text-slate-700 hover:text-blue-600">Coș</a>


            <th:block th:if="${#authorization.expression('!isAuthenticated()')}">
                <a th:href="@{/login}" class="text-slate-700 hover:text-blue-600">Login</a>
                <a th:href="@{/register}" class="text-slate-700 hover:text-blue-600">Înregistrare</a>
            </th:block>

            <th:block th:if="${#authorization.expression('isAuthenticated()')}">
                <form th:action="@{/logout}" method="post" class="inline">
                    <input type="hidden" th:name="${_csrf.parameterName}" th:value="${_csrf.token}">
                    <button type="submit"
                            class="px-3 py-1 rounded-full bg-slate-900 text-white text-xs hover:bg-slate-800">
                        Logout
                    </button>
                </form>
            </th:block>
        </nav>
    </div>
</header>

<main class="flex-1 max-w-6xl mx-auto px-4 py-8">

    <h1 class="text-3xl font-bold text-slate-900 mb-6">Coșul tău</h1>


    <div th:if="${#lists.isEmpty(cartItems)}"
         class="bg-white rounded-xl shadow-sm p-6 text-center text-slate-600">
        Coșul este gol.
        <div class="mt-4">
            <a th:href="@{/catalog}"
               class="inline-block px-4 py-2 rounded-full bg-blue-600 text-white text-sm hover:bg-blue-500">
                Înapoi la catalog
            </a>
        </div>
    </div>


    <div th:if="${!#lists.isEmpty(cartItems)}" class="space-y-4">


        <div th:each="item : ${cartItems}"
             class="bg-white rounded-xl shadow-sm p-4 flex items-center justify-between">

            <div>
                <h2 class="font-semibold text-slate-900"
                    th:text="${item.product.name}">Produs</h2>
                <p class="text-xs text-slate-500">
                    Preț:
                    <span th:text="${#numbers.formatDecimal(item.product.price,1,2)}">0.00</span> RON
                </p>
            </div>

            <div class="flex items-center gap-3">

                <form th:action="@{|/cart/update/${item.product.id}|}" method="post">
                    <input type="hidden" th:name="${_csrf.parameterName}" th:value="${_csrf.token}">
                    <input type="hidden" name="action" value="minus">
                    <button type="submit" class="px-3 py-1 rounded-full bg-slate-200 hover:bg-slate-300">
                        −
                    </button>
                </form>

                <span class="font-semibold" th:text="${item.quantity}">1</span>


                <form th:action="@{|/cart/update/${item.product.id}|}" method="post">
                    <input type="hidden" th:name="${_csrf.parameterName}" th:value="${_csrf.token}">
                    <input type="hidden" name="action" value="plus">
                    <button type="submit" class="px-3 py-1 rounded-full bg-slate-200 hover:bg-slate-300">
                        +
                    </button>
                </form>

  
                <form th:action="@{|/cart/remove/${item.product.id}|}" method="post">
                    <input type="hidden" th:name="${_csrf.parameterName}" th:value="${_csrf.token}">
                    <button type="submit" class="text-red-600 text-sm hover:underline ml-2">
                        Șterge
                    </button>
                </form>
            </div>
        </div>

        <div class="bg-white rounded-xl shadow-sm p-6 mt-6 flex flex-col sm:flex-row justify-between items-center">
            <div class="text-lg font-semibold text-slate-800">
                Total:
                <span class="text-2xl text-emerald-600"
                      th:text="${#numbers.formatDecimal(totalAmount,1,2)} + ' RON'">
                    0.00 RON
                </span>
            </div>

            <form th:action="@{/cart/checkout}" method="post" class="mt-4 sm:mt-0">
                <input type="hidden" th:name="${_csrf.parameterName}" th:value="${_csrf.token}">
                <button type="submit" class="px-6 py-2 rounded-full bg-blue-600 text-white hover:bg-blue-500">
                    Finalizează comanda
                </button>
            </form>
        </div>

    </div>
</main>

</body>
</html>
