<!doctype html>
<html xmlns:th="http://www.thymeleaf.org" lang="ro">
<head>
    <meta charset="UTF-8">
    <title>Home - AutoKat</title>
    <script src="https://cdn.tailwindcss.com"></script>
</head>

<body class="bg-slate-100 min-h-screen flex flex-col">

<header class="bg-white shadow-sm">
    <div class="max-w-4xl mx-auto px-4 py-3 flex items-center justify-between">

        <a th:href="@{/}" class="flex items-center gap-2">
            <span
                class="inline-flex h-8 w-8 items-center justify-center rounded-full bg-blue-600 text-white font-bold">
                A
            </span>
            <span class="text-xl font-semibold text-slate-800">AutoKat</span>
        </a>

        <nav class="flex items-center gap-4 text-sm">

            <span th:if="${#authorization.expression('isAuthenticated()')}">
                <a th:href="@{/catalog}"
                   class="text-slate-700 hover:text-blue-600">
                    Catalog
                </a>

                <form th:action="@{/logout}" method="post" class="inline">
                    <button type="submit"
                            class="px-3 py-1 rounded-full bg-slate-900 text-white text-xs hover:bg-slate-800">
                        Logout
                    </button>
                </form>
            </span>

            <span th:if="${#authorization.expression('!isAuthenticated()')}">
                <a th:href="@{/login}"
                   class="px-3 py-1 rounded-full bg-blue-600 text-white text-xs hover:bg-blue-500">
                    Login
                </a>
            </span>

        </nav>
    </div>
</header>

<main class="flex-1 max-w-4xl mx-auto px-4 py-10">
    <h1 class="text-3xl font-bold text-slate-900 mb-4">
        Bine ai venit pe AutoKat
    </h1>

    <p class="text-slate-600 mb-6">
        Magazin online de piese auto. Autentifică-te pentru a accesa catalogul complet.
    </p>

    <div class="flex gap-3">
        <a th:href="@{/catalog}"
           class="inline-flex items-center px-5 py-2.5 rounded-full bg-blue-600 text-white text-sm font-medium hover:bg-blue-500">
            Vezi catalogul
        </a>

        <a th:href="@{/admin/panel}"
           th:if="${#authorization.expression('hasRole(''ADMIN'')')}"
           class="inline-flex items-center px-5 py-2.5 rounded-full bg-slate-800 text-white text-sm font-medium hover:bg-slate-700">
            Panou Admin
        </a>
    </div>
</main>

</body>
</html>
